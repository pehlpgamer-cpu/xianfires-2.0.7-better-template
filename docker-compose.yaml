services:
  backend:
    build: .
    ports:
      - '9000:9000'
    depends_on:
      - db
  db:
    image: mysql:8.2
    restart: always
    environment:
      MYSQL_USER: xian
      MYSQL_DATABASE: better-xianfire
      MYSQL_PASSWORD: super-secret-password
      MYSQL_ROOT_PASSWORD: root-password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
