services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile

    working_dir: /workspace

    command: sleep infinity

    volumes:
      - .:/workspace

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xianfire}
      MYSQL_USER: ${MYSQL_USER:-xianfire}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - xianfire_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  xianfire_mysql_data: